<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;user-select:none;overflow:hidden;padding:16px;gap:16px}
.top-bar{display:flex;align-items:flex-end;justify-content:center;width:100%;position:relative}
.title-row{display:flex;align-items:center;justify-content:center;gap:5px}
.title-cube{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;font-family:'Inter',sans-serif;font-weight:900;font-size:22px;color:#fff;border-radius:5px;text-shadow:1px 1px 2px rgba(0,0,0,.4);position:relative;user-select:none;outline:1px solid rgba(255,255,255,.25);outline-offset:-2px}
.title-cube::before{content:'';position:absolute;top:2px;left:2px;right:2px;height:36%;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 100%);border-radius:3px 3px 0 0;pointer-events:none}
.title-cube::after{content:'';position:absolute;bottom:2px;left:2px;right:2px;height:33%;background:linear-gradient(0deg,rgba(0,0,0,.2) 0%,transparent 100%);border-radius:0 0 3px 3px;pointer-events:none}
.btn-row{display:flex;gap:6px}
.tbtn{flex:1;background:rgba(20,20,30,.75);border:1px solid rgba(255,255,255,.08);border-radius:6px;color:#888;font-family:'Inter',sans-serif;font-size:.6rem;font-weight:bold;letter-spacing:.08em;padding:6px 0;cursor:pointer;transition:background .15s,color .15s;text-align:center}
.tbtn:hover{background:rgba(255,255,255,.1);color:#ccc}
.tbtn.sound-on{background:rgba(200,168,232,.08);border-color:rgba(200,168,232,.2);color:#c8a8e8}
.tbtn.sound-off{background:rgba(20,20,30,.75);border-color:rgba(255,255,255,.08);color:#666}
.tbtn.pause-on{background:rgba(200,168,232,.08);border-color:rgba(200,168,232,.2);color:#c8a8e8}
/* game frame */
.game-frame{position:relative;border:2px solid #555;border-radius:16px;padding:16px 20px 20px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;gap:32px}
.game-frame::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:130px;height:4px;background:#0d0d0d;z-index:1}
.frame-label{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:#0d0d0d;padding:0 5px;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.5px;color:#555;z-index:2;white-space:nowrap}
.frame-label .bold{font-weight:700;color:#777}
.main-row{display:flex;gap:24px;align-items:flex-start}
.board-wrap{position:relative;border-radius:6px;padding:0;background:transparent;border:none}
.board-wrap canvas{display:block;border-radius:6px;border:none;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,10,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:10;border-radius:6px}
.bonus-text{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;font-size:1.2rem;font-weight:bold;font-family:'Inter',sans-serif;color:#fff;white-space:nowrap;text-shadow:0 0 3px #000,2px 2px 4px rgba(0,0,0,.9),-2px -2px 4px rgba(0,0,0,.9),0 0 18px rgba(252,228,168,.7),0 0 40px rgba(252,228,168,.35)}
.overlay-btn{padding:12px 32px;border:none;font-weight:900;cursor:pointer;border-radius:6px;background:linear-gradient(180deg,#d4f4e0 0%,#b8e8c8 35%,#90d0a8 70%,#70b088 100%);color:#fff;font-family:'Inter',sans-serif;font-size:1.1rem;text-shadow:1px 1px 2px rgba(0,0,0,.3);outline:1px solid rgba(255,255,255,.25);outline-offset:-2px;box-shadow:0 3px 6px rgba(0,0,0,.3);transition:transform .15s}
.overlay-btn:hover{transform:scale(1.05)}
.overlay-btn.small{padding:8px 16px;font-size:.8rem;width:100%}
.right-panel{display:flex;flex-direction:column;gap:10px;min-width:150px}
.stat-box{border-radius:6px;padding:10px;background:rgba(20,20,30,.75);border:1px solid rgba(255,255,255,.08)}
.stat-box .label{text-transform:uppercase;font-size:.65rem;color:#888;letter-spacing:.15em;margin-bottom:2px}
.stat-box .val{font-weight:bold;font-size:1.1rem;color:#fff;font-variant-numeric:tabular-nums}
.lb{width:85%;max-width:320px;max-height:220px;overflow-y:auto;margin-bottom:12px;scrollbar-width:thin;scrollbar-color:rgba(200,168,232,.3) transparent}
.lbTitle{font-family:'Inter',sans-serif;font-size:.7rem;color:#c8a8e8;text-transform:uppercase;letter-spacing:.15em;text-align:center;margin-bottom:8px}
.lbEmpty{color:#555;font-size:.65rem;text-align:center;padding:10px 0;font-family:'Inter',sans-serif}
.lbRow{display:flex;gap:8px;align-items:center;margin-bottom:3px;font-size:.75rem;padding:2px 6px;border-radius:3px;font-family:'Inter',sans-serif}
.lbRow.even{background:rgba(255,255,255,.03)}
.lbRow.hi{color:#fff;font-weight:bold}
.lbRow:not(.hi){color:#ccc}
.lbRow .rank{min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
.lbRow .sc{font-weight:bold;font-variant-numeric:tabular-nums}
.lbRow .tm{color:#b8e8c8;font-size:.6rem;font-variant-numeric:tabular-nums}
.lbRow .dt{color:#555;font-size:.55rem;margin-left:auto}
.go-title{font-family:'Inter',sans-serif;font-weight:900;font-size:1.2rem;margin-bottom:6px;color:#f0a8b8}
.victory-title{font-family:'Inter',sans-serif;font-weight:900;font-size:1.3rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;color:#fce4a8;white-space:nowrap;text-shadow:0 0 20px rgba(252,228,168,.6),0 0 40px rgba(252,228,168,.3);animation:vicGlow 1.5s ease-in-out infinite}
.victory-star{font-size:2.4rem;color:#fce4a8;margin-bottom:6px;text-shadow:0 0 20px rgba(252,228,168,.7),0 0 40px rgba(252,228,168,.4);animation:vicStar 2s ease-in-out infinite}
@keyframes vicStar{0%,100%{transform:scale(1);text-shadow:0 0 20px rgba(252,228,168,.7),0 0 40px rgba(252,228,168,.4)}50%{transform:scale(1.15);text-shadow:0 0 30px rgba(252,228,168,.9),0 0 60px rgba(252,228,168,.5),0 0 80px rgba(252,228,168,.3)}}
@keyframes vicGlow{0%,100%{text-shadow:0 0 20px rgba(252,228,168,.6),0 0 40px rgba(252,228,168,.3)}50%{text-shadow:0 0 30px rgba(252,228,168,.8),0 0 60px rgba(252,228,168,.4),0 0 80px rgba(252,228,168,.2)}}
.lbDot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.lbDot.norm{background:rgba(255,255,255,.35)}
.lbDot.vic{color:#fce4a8;font-size:10px;line-height:1;text-shadow:0 0 6px rgba(252,228,168,.5);background:none;border-radius:0;width:auto;height:auto;cursor:default}
.gp-indicator{position:absolute;bottom:8px;left:8px;z-index:15;pointer-events:none;font-size:.55rem;color:#888}
#pause-overlay{background:rgba(10,10,16,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pause-title{font-family:'Inter',sans-serif;font-weight:900;font-size:1.8rem;color:#c8a8e8;animation:pulse 1s ease-in-out infinite}
.pause-hint{margin-top:12px;font-size:.7rem;color:#888;font-family:'Inter',sans-serif}
.restart-title{font-family:'Inter',sans-serif;font-weight:900;font-size:1.1rem;color:#f0a8b8;margin-bottom:12px}
.restart-hint{font-size:.65rem;color:#888;font-family:'Inter',sans-serif;margin-top:10px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
svg{display:inline-block;vertical-align:middle}
</style>

<body>
<div class="game-frame">

  <div class="board-wrap" id="canvas-wrap">

<div class="frame-label">conceptual<span class="bold">project</span></div>

<script>
// ═══════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════
var COLS = 8, ROWS = 14, CELL = 34, GAP = 2;
var CELL_FULL = CELL + GAP;
var BW = COLS * CELL_FULL + GAP;
var BH = ROWS * CELL_FULL + GAP;
var LAUNCHER_H = 56;
var CANVAS_W = BW;
var CANVAS_H = BH + LAUNCHER_H;
var NUM_COLORS = 5;
var INIT_ROWS = 4;
var LB_KEY = 'cubefall_lb';
var LB_MAX = 5;
var LANG_KEY = 'cubefall_lang';
var SOUND_KEY = 'cubefall_sound';
var DESCEND_INTERVAL = 4;
var SHOOT_SPEED = 650;

var COLORS = [
  { base:'#a8d8ea', light:'#d0eef8', mid:'#88c8dc', dark:'#68a8bc', glow:[168,216,234] },
  { base:'#fce4a8', light:'#fef0cc', mid:'#f0d080', dark:'#d4b058', glow:[252,228,168] },
  { base:'#d4b8e8', light:'#e8d4f4', mid:'#b898d0', dark:'#9878b0', glow:[212,184,232] },
  { base:'#b8e8c8', light:'#d4f4e0', mid:'#90d0a8', dark:'#70b088', glow:[184,232,200] },
  { base:'#f0b8c0', light:'#f8d4d8', mid:'#e09098', dark:'#c87078', glow:[240,184,192] },
];

var TITLE_PIECE_COLORS = [COLORS[0],COLORS[1],COLORS[2],COLORS[3],COLORS[4],COLORS[0],COLORS[1],COLORS[2]];

// ═══════════════════════════════════════════════════
// LOCALIZATION
// ═══════════════════════════════════════════════════
var LOC = {
  play:{ru:'ИГРАТЬ',en:'PLAY'},
  gameOver:{ru:'КОНЕЦ ИГРЫ',en:'GAME OVER'},score:{ru:'Счёт',en:'Score'},time:{ru:'Время',en:'Time'},
  leaderboard:{ru:'Топ-5',en:'Top-5'},
  noRecords:{ru:'Пока нет рекордов',en:'No records yet'},
  fallBonus:{ru:'ОБРЫВ! +',en:'FALL BONUS! +'},
  freeShot:{ru:' БЕСПЛАТНЫЙ ХОД!',en:' FREE SHOT!'},fullCol:{ru:'СТОЛБЕЦ ПОЛОН',en:'COLUMN FULL'},
  combo:{ru:'КОМБО ×',en:'COMBO ×'},
  nearClear:{ru:'ПОЧТИ ЧИСТО! +',en:'NEAR CLEAR! +'},
  megaFall:{ru:'МЕГА ОБРЫВ! +',en:'MEGA FALL! +'},
  victory:{ru:'ПОЛНАЯ ОЧИСТКА!',en:'PERFECT CLEAR!'},
  victoryPts:{ru:'+100 000 БОНУС!',en:'+100 000 BONUS!'},
  gamepad:{ru:'Геймпад подключён',en:'Gamepad connected'},
  pause:{ru:'ПАУЗА',en:'PAUSE'},
  pauseHint:{ru:'коснись чтобы продолжить',en:'tap to resume'},
  restartQ:{ru:'Начать заново?',en:'Restart?'},
  restartYes:{ru:'ДА',en:'YES'},
  restartHint:{ru:'A — да, B — нет',en:'A — yes, B — no'},
};

function l(k){return LOC[k]&&LOC[k][state.lang]||LOC[k]&&LOC[k].ru||k}

// ═══════════════════════════════════════════════════
// GAME LOGIC HELPERS
// ═══════════════════════════════════════════════════
function randomColor(){return Math.floor(Math.random()*NUM_COLORS)}

function randomColorFromField(grid,excludeColor){
  var colorSet=new Set();
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(grid[r][c]>=0)colorSet.add(grid[r][c]);
  if(colorSet.size===0)return randomColor();
  if(excludeColor!==undefined&&colorSet.has(excludeColor)&&colorSet.size>1)colorSet.delete(excludeColor);
  var arr=Array.from(colorSet);
  return arr[Math.floor(Math.random()*arr.length)];
}

function createGrid(fillRows){
  var grid=[];
  for(var r=0;r<ROWS;r++){
    grid[r]=[];
    for(var c=0;c<COLS;c++){
      if(r<fillRows){
        var forbidden=new Set();
        if(c>=2&&grid[r][c-1]===grid[r][c-2])forbidden.add(grid[r][c-1]);
        if(r>=2&&grid[r-1][c]===grid[r-2][c])forbidden.add(grid[r-1][c]);
        var color=randomColor(),attempts=0;
        while(forbidden.has(color)&&attempts<30){color=randomColor();attempts++}
        grid[r][c]=color;
      }else{grid[r][c]=-1}
    }
  }
  return grid;
}

function addTopRow(grid){
  for(var r=ROWS-1;r>=1;r--)for(var c=0;c<COLS;c++)grid[r][c]=grid[r-1][c];
  for(var c=0;c<COLS;c++){
    var forbidden=new Set();
    if(c>=2&&grid[0][c-1]!==-1&&grid[0][c-1]===grid[0][c-2])forbidden.add(grid[0][c-1]);
    if(grid[1][c]!==-1&&grid[1][c]===grid[2][c])forbidden.add(grid[1][c]);
    var color=randomColor(),attempts=0;
    while(forbidden.has(color)&&attempts<20){color=randomColor();attempts++}
    grid[0][c]=color;
  }
  return grid;
}

function calculateTrajectory(grid,targetX,targetY){
  var launchX=BW/2,launchY=BH+LAUNCHER_H/2;
  var dx=targetX-launchX,dy=targetY-launchY;
  var len=Math.sqrt(dx*dx+dy*dy);
  if(len<1)return null;
  dx/=len;dy/=len;
  if(dy>=-0.001)return null; // near-horizontal aim → no valid trajectory
  var maxSlope=4.0;
  if(Math.abs(dx/dy)>maxSlope){
    dx=Math.sign(dx)*(-dy)*maxSlope;
    var nl=Math.sqrt(dx*dx+dy*dy);dx/=nl;dy/=nl;
  }
  var leftB=GAP+CELL/2,rightB=BW-GAP-CELL/2;
  var path=[{x:launchX,y:launchY}];
  var x=launchX,y=launchY,prevRow=-1,prevCol=-1,step=1.5;
  for(var i=0;i<2000;i++){
    x+=dx*step;y+=dy*step;
    if(x<leftB){
      var t=(leftB-(x-dx*step))/(dx*step);
      var by=(y-dy*step)+dy*step*t;
      path.push({x:leftB,y:by});
      x=leftB+(leftB-x);dx=-dx;
    }else if(x>rightB){
      var t=(rightB-(x-dx*step))/(dx*step);
      var by=(y-dy*step)+dy*step*t;
      path.push({x:rightB,y:by});
      x=rightB-(x-rightB);dx=-dx;
    }
    if(y>=0&&y<BH){
      var gc=Math.floor((x-GAP)/CELL_FULL);
      var gr=Math.floor((y-GAP)/CELL_FULL);
      if(gc>=0&&gc<COLS&&gr>=0&&gr<ROWS){
        if(grid[gr][gc]!==-1){
          path.push({x:x,y:y});
          if(prevRow>=0&&prevCol>=0&&prevRow<ROWS&&prevCol<COLS&&grid[prevRow][prevCol]===-1)
            return{landRow:prevRow,landCol:prevCol,path:path};
          return null;
        }
        prevRow=gr;prevCol=gc;
      }
    }
    if(y<GAP){
      var gc2=Math.max(0,Math.min(COLS-1,Math.floor((x-GAP)/CELL_FULL)));
      path.push({x:x,y:0});
      if(grid[0][gc2]===-1)return{landRow:0,landCol:gc2,path:path};
      return null;
    }
  }
  return null;
}

function findGroupAt(grid,row,col){
  if(row<0||row>=ROWS||col<0||col>=COLS)return new Set();
  var color=grid[row][col];
  if(color===-1)return new Set();
  var visited=[];for(var i=0;i<ROWS;i++){visited[i]=[];for(var j=0;j<COLS;j++)visited[i][j]=false;}
  var group=new Set();
  var queue=[[row,col]];visited[row][col]=true;
  var dirs=[[0,1],[0,-1],[1,0],[-1,0]];
  while(queue.length>0){
    var cur=queue.shift();var cr=cur[0],cc=cur[1];
    group.add(cr+','+cc);
    for(var d=0;d<dirs.length;d++){
      var nr=cr+dirs[d][0],nc=cc+dirs[d][1];
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!visited[nr][nc]&&grid[nr][nc]===color){
        visited[nr][nc]=true;queue.push([nr,nc]);
      }
    }
  }
  return group;
}

function getConnectedToCeiling(grid){
  var connected=[];for(var i=0;i<ROWS;i++){connected[i]=[];for(var j=0;j<COLS;j++)connected[i][j]=false;}
  var queue=[];
  for(var c=0;c<COLS;c++){if(grid[0][c]!==-1){connected[0][c]=true;queue.push([0,c]);}}
  var dirs=[[0,1],[0,-1],[1,0],[-1,0]];
  while(queue.length>0){
    var cur=queue.shift();var r=cur[0],c=cur[1];
    for(var d=0;d<dirs.length;d++){
      var nr=r+dirs[d][0],nc=c+dirs[d][1];
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!connected[nr][nc]&&grid[nr][nc]!==-1){
        connected[nr][nc]=true;queue.push([nr,nc]);
      }
    }
  }
  return connected;
}

function findDisconnected(grid){
  var connected=getConnectedToCeiling(grid);
  var disconnected=new Set();
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)
    if(grid[r][c]!==-1&&!connected[r][c])disconnected.add(r+','+c);
  return disconnected;
}

function isGameOver(grid){
  for(var c=0;c<COLS;c++)if(grid[ROWS-1][c]!==-1)return true;
  return false;
}

// ═══════════════════════════════════════════════════
// LEADERBOARD
// ═══════════════════════════════════════════════════
function loadLB(){
  try{var d=localStorage.getItem(LB_KEY);if(d)return JSON.parse(d).slice(0,LB_MAX)}catch(e){}
  return[];
}
function saveLB(lb){try{localStorage.setItem(LB_KEY,JSON.stringify(lb))}catch(e){}}
function formatTime(sec){
  var m=Math.floor(sec/60),s=Math.floor(sec%60);
  return m+':'+(s<10?'0':'')+s;
}
function addLBScore(sc,sec,lang,vic){
  var lb=loadLB();
  var entry={score:sc,time:Math.round(sec),date:new Date().toLocaleDateString(lang==='ru'?'ru-RU':'en-US')};
  if(vic)entry.victory=true;
  lb.push(entry);lb.sort(function(a,b){return b.score-a.score});
  if(lb.length>LB_MAX)lb.length=LB_MAX;
  saveLB(lb);
  return{lb:lb,hi:lb.indexOf(entry)};
}

// ═══════════════════════════════════════════════════
// ATLAS (pre-rendered cube sprites)
// ═══════════════════════════════════════════════════
var atlasCanvas = null;

function buildAtlas(){
  atlasCanvas = document.createElement('canvas');
  atlasCanvas.width = CELL * NUM_COLORS;
  atlasCanvas.height = CELL;
  var actx = atlasCanvas.getContext('2d');
  for(var ci=0; ci<NUM_COLORS; ci++){
    var co=COLORS[ci];
    var px=ci*CELL, py=0, sz=CELL, r=4;
    // Main gradient fill
    var g=actx.createLinearGradient(px,py,px,py+sz);
    g.addColorStop(0,co.light); g.addColorStop(.35,co.base);
    g.addColorStop(.7,co.mid); g.addColorStop(1,co.dark);
    actx.fillStyle=g;
    rrect(actx,px+.5,py+.5,sz-1,sz-1,r); actx.fill();
    // Inner white border
    actx.strokeStyle='rgba(255,255,255,.25)'; actx.lineWidth=1;
    rrect(actx,px+1.5,py+1.5,sz-3,sz-3,r-.5); actx.stroke();
    // Shine (top highlight)
    var shineH=sz*.36;
    actx.save(); actx.globalAlpha=.45;
    var sg=actx.createLinearGradient(px,py,px,py+shineH);
    sg.addColorStop(0,'rgba(255,255,255,.45)'); sg.addColorStop(1,'rgba(255,255,255,0)');
    actx.fillStyle=sg;
    rrect(actx,px+2,py+2,sz-4,shineH,[r-1,r-1,0,0]); actx.fill();
    actx.restore();
    // Shadow (bottom)
    actx.save(); actx.globalAlpha=.3;
    var bg=actx.createLinearGradient(px,py+sz*.67,px,py+sz);
    bg.addColorStop(0,'rgba(0,0,0,0)'); bg.addColorStop(1,'rgba(0,0,0,.2)');
    actx.fillStyle=bg;
    rrect(actx,px+2,py+sz*.67,sz-4,sz*.31,[0,0,r-1,r-1]); actx.fill();
    actx.restore();
  }
}

// ═══════════════════════════════════════════════════
// CANVAS DRAWING
// ═══════════════════════════════════════════════════
function rrect(ctx,x,y,w,h,radii){
  var tl,tr,br,bl;
  if(Array.isArray(radii)){tl=radii[0];tr=radii[1];br=radii[2];bl=radii[3]}
  else{tl=tr=br=bl=radii}
  ctx.beginPath();
  ctx.moveTo(x+tl,y); ctx.lineTo(x+w-tr,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+tr);
  ctx.lineTo(x+w,y+h-br);
  ctx.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
  ctx.lineTo(x+bl,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-bl);
  ctx.lineTo(x,y+tl);
  ctx.quadraticCurveTo(x,y,x+tl,y);
  ctx.closePath();
}

function drawCube(ctx,px,py,ci,sz,sel,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  if(atlasCanvas){
    ctx.drawImage(atlasCanvas, ci*CELL, 0, CELL, CELL, px, py, sz, sz);
  }
  // Selection highlight (drawn on top of atlas sprite)
  if(sel){
    ctx.globalAlpha=.4*alpha;ctx.fillStyle='#fff';
    rrect(ctx,px+.5,py+.5,sz-1,sz-1,4);ctx.fill();
    ctx.globalAlpha=.9*alpha;ctx.strokeStyle='#fff';ctx.lineWidth=2;
    rrect(ctx,px+1,py+1,sz-2,sz-2,4);ctx.stroke();
  }
  ctx.restore();
}

function createAudioCtx(){
  try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){audioCtx=null;state.soundOn=false}
  if(audioCtx){
    audioCtx.onstatechange=function(){
      if(audioCtx&&audioCtx.state==='interrupted'){audioCtx.resume().catch(function(){})}
    };
  }
}

function initAudio(){
  if(!audioCtx&&state.soundOn){
    createAudioCtx();
  }
  if(audioCtx){
    if(audioCtx.state==='suspended'||audioCtx.state==='interrupted'){
      audioCtx.resume().catch(function(){});
    }else if(audioCtx.state==='closed'){
      audioCtx=null;createAudioCtx();
    }
  }
}

function playTone(freq,duration,volume,type){
  if(!state.soundOn)return;
  if(!audioCtx||audioCtx.state==='closed'){audioCtx=null;createAudioCtx()}
  if(!audioCtx)return;
  if(audioCtx.state==='suspended'||audioCtx.state==='interrupted'){
    audioCtx.resume().catch(function(){});
  }
  try{
    var osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type=type||'sine';osc.frequency.value=freq;
    var v=Math.min(volume,0.3);
    gain.gain.setValueAtTime(v,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+duration);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);osc.stop(audioCtx.currentTime+duration);
  }catch(e){audioCtx=null;createAudioCtx()}
}

  if(!document.hidden){initAudio()}

function afterResolve(){
  var g=grid;
  var occRows=0;
  for(var r=0;r<ROWS;r++){for(var c=0;c<COLS;c++){if(g[r][c]!==-1){occRows++;break}}}
  if(occRows===1&&!nearClearGiven){
    nearClearGiven=true;
    var ncPts=300;score+=ncPts;updateScore();
    showBonus(l('nearClear')+ncPts,2000);
    sfx.nearClear();
  }
  if(occRows>1)nearClearGiven=false;
  if(occRows===0){
    score+=100000;updateScore();
    active=false;
    var elapsed=gameElapsed+(performance.now()-gameStartTime)/1000;var res=addLBScore(score,elapsed,state.lang,true);state.uiLB=res.lb;state.uiHi=res.hi;
    showBonus(l('victoryPts'),3000);
    sfx.victory();
    setTimeout(function(){showOverlay('victory')},2500);
    phase={type:'idle'};return;
  }
  if(disconnectReward){disconnectReward=false;phase={type:'idle'};return}
  shotCount++;
  if(shotCount%DESCEND_INTERVAL===0){
    for(var c=0;c<COLS;c++){
      if(g[ROWS-1][c]!==-1){
        active=false;
        var elapsed=gameElapsed+(performance.now()-gameStartTime)/1000;var res=addLBScore(score,elapsed,state.lang);state.uiLB=res.lb;state.uiHi=res.hi;
        sfx.gameOver();showOverlay('gameover');phase={type:'idle'};return;
      }
    }
    sfx.descend();phase={type:'descending',t0:performance.now(),dur:300};return;
  }
  if(isGameOver(g)){
    active=false;
    var elapsed2=gameElapsed+(performance.now()-gameStartTime)/1000;var res=addLBScore(score,elapsed2,state.lang);state.uiLB=res.lb;state.uiHi=res.hi;
    sfx.gameOver();showOverlay('gameover');
  }
  phase={type:'idle'};
}

function processMatches(){
  var g=grid;
  var group=findGroupAt(g,lastLandRow,lastLandCol);
  if(group.size>=3){
    comboCount++;
    var totalRemoved=group.size;
    var basePts=totalRemoved*10;
    if(totalRemoved>=7)basePts=totalRemoved*25;
    else if(totalRemoved>=5)basePts=totalRemoved*18;
    else if(totalRemoved>=4)basePts=totalRemoved*14;
    var comboMult=1+Math.min(comboCount-1,4)*0.5;
    var pts=Math.round(basePts*comboMult);
    score+=pts;updateScore();
    if(comboCount>=2){
      showBonus(l('combo')+comboCount+'! +'+pts,1500);
      sfx.combo(comboCount);
    }else if(totalRemoved>=5){
      showBonus('+'+pts);
    }
    sfx.match(totalRemoved);
    group.forEach(function(key){var parts=key.split(',');var r=+parts[0],c=+parts[1];spawnParticles(r,c,g[r][c])});
    phase={type:'removing',cells:group,t0:performance.now(),dur:280};return;
  }
  comboCount=0;
  var disconnected=findDisconnected(g);
  if(disconnected.size>0){
    disconnectReward=true;
    var dPts=disconnected.size*15;
    if(disconnected.size>=10){var mult=1.5+Math.min(disconnected.size-10,10)*0.1;dPts=Math.round(dPts*mult);showBonus(l('megaFall')+dPts+l('freeShot'),2000);sfx.megaFall()}
    else{showBonus(l('fallBonus')+dPts+l('freeShot'))}
    score+=dPts;updateScore();
    sfx.fall(disconnected.size);
    disconnected.forEach(function(key){var parts=key.split(',');var r=+parts[0],c=+parts[1];spawnParticles(r,c,g[r][c])});
    phase={type:'disconnect',cells:new Set(disconnected),t0:performance.now(),dur:300};return;
  }
  afterResolve();
}

function afterRemove(){
  var ph=phase;var g=grid;
  ph.cells.forEach(function(key){var parts=key.split(',');g[+parts[0]][+parts[1]]=-1});
  var disconnected=findDisconnected(g);
  if(disconnected.size>0){
    disconnectReward=true;
    var dPts=disconnected.size*15;
    if(disconnected.size>=10){var mult=1.5+Math.min(disconnected.size-10,10)*0.1;dPts=Math.round(dPts*mult);showBonus(l('megaFall')+dPts+l('freeShot'),2000);sfx.megaFall()}
    else{showBonus(l('fallBonus')+dPts+l('freeShot'),1800)}
    score+=dPts;updateScore();
    sfx.fall(disconnected.size);
    disconnected.forEach(function(key){var parts=key.split(',');var r=+parts[0],c=+parts[1];spawnParticles(r,c,g[r][c])});
    phase={type:'disconnect',cells:new Set(disconnected),t0:performance.now(),dur:300};return;
  }
  afterResolve();
}

function afterDisconnect(){
  var ph=phase;var g=grid;
  ph.cells.forEach(function(key){var parts=key.split(',');g[+parts[0]][+parts[1]]=-1});
  afterResolve();
}

function afterDescend(){
  var g=grid;addTopRow(g);
  if(isGameOver(g)){
    active=false;
    var elapsed2=gameElapsed+(performance.now()-gameStartTime)/1000;var res=addLBScore(score,elapsed2,state.lang);state.uiLB=res.lb;state.uiHi=res.hi;
    sfx.gameOver();showOverlay('gameover');

}

// ═══════════════════════════════════════════════════
// SHOOT (shared by pointer, gamepad)
// ═══════════════════════════════════════════════════
function shootAt(mx,my){
  if(!active||phase.type!=='idle')return;
  var result=calculateTrajectory(grid,mx,my);
  if(!result){sfx.fullCol();showBonus(l('fullCol'),800);return}
  var landRow=result.landRow,landCol=result.landCol,path=result.path;
  var totalLen=0;
  for(var i=1;i<path.length;i++){
    var ddx=path[i].x-path[i-1].x,ddy=path[i].y-path[i-1].y;
    totalLen+=Math.sqrt(ddx*ddx+ddy*ddy);
  }
  var color=currentColor;
  phase={type:'shooting',landRow:landRow,landCol:landCol,color:color,path:path,t0:performance.now(),dur:Math.max(150,totalLen/SHOOT_SPEED*1000)};
  sfx.shoot();
  if(path.length>2){
    var accLen=0;
    for(var i=1;i<path.length;i++){
      var ddx=path[i].x-path[i-1].x,ddy=path[i].y-path[i-1].y;
      accLen+=Math.sqrt(ddx*ddx+ddy*ddy);
      if(i<path.length-1){
        var bounceTime=(accLen/totalLen)*(totalLen/SHOOT_SPEED*1000);
        (function(bt){setTimeout(function(){sfx.ricochet()},Math.max(50,bt))})(bounceTime);
      }
    }
  }
  trajPreview=null;
  currentColor=nextColor;
  nextColor=randomColorFromField(grid,currentColor);
}

function handlePointerDown(e){
  if(e.button===2)return; // right-click → contextmenu will handle swap
  e.preventDefault(); // prevent compatibility mouse events & browser gestures
  initAudio();

  var rect=cv.getBoundingClientRect();
  var sx=cv.width/rect.width,sy=cv.height/rect.height;
  var mx=(e.clientX-rect.left)*sx, my=(e.clientY-rect.top)*sy;

  if(e.pointerType==='touch'){
    // Touch: start tracking for drag-to-aim, release-to-shoot
    pointerTracking=true;
    mousePos={x:mx,y:my};
    gpAimActive=false;
    if(active&&phase.type==='idle'&&my<BH){
      trajPreview=calculateTrajectory(grid,mx,my);
    }else{
      trajPreview=null;
    }
  }else{
    // Mouse: shoot immediately on click
    if(my>=BH)return;
    shootAt(mx,my);
  }
}

function handlePointerMove(e){
  var rect=cv.getBoundingClientRect();
  var sx=cv.width/rect.width,sy=cv.height/rect.height;
  var mx=(e.clientX-rect.left)*sx, my=(e.clientY-rect.top)*sy;
  mousePos={x:mx,y:my};
  gpAimActive=false;

  if(e.pointerType==='touch'&&pointerTracking){
    // Touch drag: update aim trajectory in real-time
    if(active&&phase.type==='idle'&&my<BH){
      trajPreview=calculateTrajectory(grid,mx,my);
    }else{
      trajPreview=null;
    }
  }else if(e.pointerType!=='touch'){
    // Mouse hover: update aim trajectory
    if(active&&phase.type==='idle'&&my<BH){
      trajPreview=calculateTrajectory(grid,mx,my);
    }else{
      trajPreview=null;
    }
  }
}

function handlePointerUp(e){
  if(e.pointerType==='touch'&&pointerTracking){
    pointerTracking=false;
    if(!active||phase.type!=='idle')return;
    var aimX=mousePos?mousePos.x:BW/2;
    var aimY=mousePos?mousePos.y:BH/2;
    if(aimY>=BH)return;
    shootAt(aimX,aimY);
    trajPreview=null;
  }
}

function handlePointerLeave(e){
  if(e.pointerType==='touch'){
    pointerTracking=false;
  }
  mousePos=null;trajPreview=null;
}

function handleContextMenu(e){
  e.preventDefault();
  initAudio();
  if(!active||phase.type!=='idle')return;
  var tmp=currentColor;currentColor=nextColor;nextColor=tmp;
  swapAnim=performance.now();
  sfx.swap();
}

// ═══════════════════════════════════════════════════
// GAMEPAD
// ═══════════════════════════════════════════════════
function pollGamepad(dt){
  var gamepads=navigator.getGamepads?navigator.getGamepads():[];
  var gp=null;
  for(var i=0;i<gamepads.length;i++){if(gamepads[i]){gp=gamepads[i];break}}
  if(!gp){gpPrevState=null;return}
  var gpJustPressed=function(idx){
    return(gp.buttons[idx]&&gp.buttons[idx].pressed||false)&&!(gpPrevState&&gpPrevState.buttons[idx]||false);
  };
  var ax=gp.axes[0]||0, ay=gp.axes[1]||0;
  var deadzone=0.2;
  if(Math.abs(ax)<deadzone)ax=0;
  if(Math.abs(ay)<deadzone)ay=0;
  var dLeft=gp.buttons[14]&&gp.buttons[14].pressed||false;
  var dRight=gp.buttons[15]&&gp.buttons[15].pressed||false;
  var dUp=gp.buttons[12]&&gp.buttons[12].pressed||false;
  var dDown=gp.buttons[13]&&gp.buttons[13].pressed||false;
  if(dLeft)ax=-1; if(dRight)ax=1; if(dUp)ay=-1; if(dDown)ay=1;
  if(ax!==0||ay!==0||dLeft||dRight||dUp||dDown){
    gpAimActive=true;
    gpAimX+=ax*GP_AIM_SPEED*dt;
    gpAimY+=ay*GP_AIM_SPEED*dt;
    gpAimX=Math.max(CELL/2,Math.min(BW-CELL/2,gpAimX));
    gpAimY=Math.max(CELL/2,Math.min(BH-CELL/2,gpAimY));
    mousePos={x:gpAimX,y:gpAimY};
    if(active&&phase.type==='idle'&&gpAimY<BH){
      trajPreview=calculateTrajectory(grid,gpAimX,gpAimY);
    }
  }
  if(gpJustPressed(0)){
    initAudio();
    if(restartConfirm){
      restartConfirm=false;
      document.getElementById('restart-overlay').style.display='none';
      paused=false;document.getElementById('pause-overlay').style.display='none';updatePauseBtn();
      startGame();
    }else if(paused){
    }else if(!active||phase.type!=='idle'){
      if(state.overlay==='start'||state.overlay==='gameover'||state.overlay==='victory')startGame();
    }else if(mousePos&&mousePos.y<BH){
      // Allow shooting even without prior stick movement —
      // use default aim position if gpAimActive is still false
      if(!gpAimActive){gpAimActive=true;mousePos={x:gpAimX,y:gpAimY};}
      shootAt(mousePos.x,mousePos.y);
    }
  }
  if(gpJustPressed(1)){
    if(restartConfirm){restartConfirm=false;paused=false;gameElapsed+=(pauseStartT-gameStartTime)/1000;gameStartTime=performance.now();document.getElementById('restart-overlay').style.display='none';cv.style.cursor='crosshair';updatePauseBtn();return}
    if(active&&phase.type==='idle'&&!paused){
      initAudio();
      var tmp=currentColor;currentColor=nextColor;nextColor=tmp;
      swapAnim=performance.now();sfx.swap();
    }
  }
  if(gpJustPressed(9)){
    initAudio();
    if(restartConfirm){restartConfirm=false;paused=false;gameElapsed+=(pauseStartT-gameStartTime)/1000;gameStartTime=performance.now();document.getElementById('restart-overlay').style.display='none';cv.style.cursor='crosshair';updatePauseBtn();return}
    if(state.overlay==='start'||state.overlay==='gameover'||state.overlay==='victory'){startGame()}
    else if(paused){togglePause()}
    else if(active){togglePause()}
  }
  if(gpJustPressed(8)){
    initAudio();
    if(restartConfirm){restartConfirm=false;paused=false;gameElapsed+=(pauseStartT-gameStartTime)/1000;gameStartTime=performance.now();document.getElementById('restart-overlay').style.display='none';cv.style.cursor='crosshair';updatePauseBtn();return}
    if(active&&!paused&&state.overlay==='none'){
      restartConfirm=true;
      paused=true;
      pauseStartT=performance.now();
      document.getElementById('pause-overlay').style.display='none';
      var rEl=document.getElementById('restart-overlay');
      rEl.style.display='flex';
      document.getElementById('restart-title').textContent=l('restartQ');
      document.getElementById('restart-yes-btn').textContent=l('restartYes');
      document.getElementById('restart-hint').textContent=l('restartHint');
      cv.style.cursor='default';
    }
  }
  gpPrevState={
    buttons:Array.prototype.slice.call(gp.buttons).map(function(b){return b.pressed}),
    axes:Array.prototype.slice.call(gp.axes)
  };
}

window.addEventListener('gamepadconnected',function(){
  gpConnected=true;
  document.getElementById('gpIndicator').textContent='🎮 '+l('gamepad');
});
window.addEventListener('gamepaddisconnected',function(){
  gpConnected=false;gpPrevState=null;gpAimActive=false;
  document.getElementById('gpIndicator').textContent='';
});

// ═══════════════════════════════════════════════════
// PAUSE
// ═══════════════════════════════════════════════════
function togglePause(){
  if(!active||state.overlay!=='none')return;
  paused=!paused;
  var el=document.getElementById('pause-overlay');
  if(paused){
    el.style.display='flex';
    document.getElementById('pause-title').textContent=l('pause');
    document.getElementById('pause-hint').textContent=l('pauseHint');
    cv.style.cursor='default';
    pauseStartT=performance.now();
  }else{
    el.style.display='none';
    cv.style.cursor='crosshair';
    gameElapsed+=(pauseStartT-gameStartTime)/1000;
    gameStartTime=performance.now();
    if(restartConfirm){restartConfirm=false;document.getElementById('restart-overlay').style.display='none'}
  }
  updatePauseBtn();
}

function updatePauseBtn(){
  var btn=document.getElementById('pause-btn');
  if(!btn)return;
  if(paused){
    btn.className='tbtn pause-on';
  }else{
    btn.className='tbtn';
  }
}

document.getElementById('pause-btn').addEventListener('click',function(){
  initAudio();
  togglePause();
});

document.getElementById('pause-overlay').addEventListener('click',function(){
  if(paused)togglePause();
});

// ═══════════════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════════════
var cv, ctx, lastT;

function render(now){
  var dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;
  var ph=phase;

  if(gpConnected)pollGamepad(dt);

  if(paused){requestAnimationFrame(render);return}
  updateTime();
  if(ph.type==='shooting'&&now-ph.t0>=ph.dur)afterShoot();
  else if(ph.type==='removing'&&now-ph.t0>=ph.dur)afterRemove();
  else if(ph.type==='disconnect'&&now-ph.t0>=ph.dur)afterDisconnect();
  else if(ph.type==='descending'&&now-ph.t0>=ph.dur)afterDescend();

  var w=0;
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt/p.ml;
    if(p.life>0)particles[w++]=p;
  }
  particles.length=w;

  // ─── DRAW ───
  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);

  // Full canvas background
  ctx.fillStyle='#0e0e18';
  ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

  // Grid lines (extend through launcher area)
  ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=0.5;
  for(var r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,GAP/2+r*CELL_FULL);ctx.lineTo(BW,GAP/2+r*CELL_FULL);ctx.stroke()}
  for(var c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(GAP/2+c*CELL_FULL,0);ctx.lineTo(GAP/2+c*CELL_FULL,CANVAS_H);ctx.stroke()}

  // Trajectory preview (hover / touch drag)
  var preview=trajPreview;
  if(preview&&active&&ph.type==='idle'){
    ctx.save();
    ctx.setLineDash([4,6]);
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(preview.path[0].x,preview.path[0].y);
    for(var i=1;i<preview.path.length;i++)ctx.lineTo(preview.path[i].x,preview.path[i].y);
    ctx.stroke();ctx.setLineDash([]);ctx.restore();
    // Landing ghost cube
    var gpx=GAP+preview.landCol*CELL_FULL;
    var gpy=GAP+preview.landRow*CELL_FULL;
    drawCube(ctx,gpx,gpy,currentColor,CELL,false,0.3);
  }

  // Gamepad aim crosshair
  if(gpAimActive&&active&&ph.type==='idle'&&mousePos&&mousePos.y<BH){
    ctx.save();
    var gpx2=mousePos.x,gpy2=mousePos.y;
    var pulse=.5+.5*Math.sin(now*.004);
    ctx.strokeStyle='rgba(255,255,255,'+(0.3+0.2*pulse)+')';
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(gpx2,gpy2,8+pulse*3,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(gpx2-14,gpy2);ctx.lineTo(gpx2-4,gpy2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(gpx2+4,gpy2);ctx.lineTo(gpx2+14,gpy2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(gpx2,gpy2-14);ctx.lineTo(gpx2,gpy2-4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(gpx2,gpy2+4);ctx.lineTo(gpx2,gpy2+14);ctx.stroke();
    ctx.restore();
  }

  // Draw cubes
  var g=grid;
  var ease=function(t){return t*(2-t)};

  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var val=g[r][c];
      if(val===-1)continue;
      var px=GAP+c*CELL_FULL;
      var py=GAP+r*CELL_FULL;
      var alpha=1,sz=CELL;

      if(ph.type==='removing'&&ph.cells.has(r+','+c)){
        var prog=Math.min((now-ph.t0)/ph.dur,1);
        alpha=1-prog;sz=CELL*(1-prog*0.3);
        var offset=(CELL-sz)/2;px+=offset;py+=offset;
      }
      if(ph.type==='disconnect'&&ph.cells.has(r+','+c)){
        var prog=Math.min((now-ph.t0)/ph.dur,1);
        alpha=1-prog;py+=prog*CELL_FULL*2;
      }
      if(ph.type==='descending'){
        var prog=ease(Math.min((now-ph.t0)/ph.dur,1));
        py-=(1-prog)*CELL_FULL;
      }
      drawCube(ctx,px,py,val,sz,false,alpha);
    }
  }

  // Draw shooting cube along trajectory path
  if(ph.type==='shooting'){
    var prog=Math.min((now-ph.t0)/ph.dur,1);
    var totalLen=0;var segLens=[0];
    for(var i=1;i<ph.path.length;i++){
      var ddx=ph.path[i].x-ph.path[i-1].x,ddy=ph.path[i].y-ph.path[i-1].y;
      totalLen+=Math.sqrt(ddx*ddx+ddy*ddy);segLens.push(totalLen);
    }
    var targetDist=ease(prog)*totalLen;
    var sx=ph.path[0].x,sy=ph.path[0].y;
    for(var i=1;i<ph.path.length;i++){
      if(segLens[i]>=targetDist){
        var segStart=segLens[i-1],segLen=segLens[i]-segStart;
        var t=segLen>0?(targetDist-segStart)/segLen:0;
        sx=ph.path[i-1].x+(ph.path[i].x-ph.path[i-1].x)*t;
        sy=ph.path[i-1].y+(ph.path[i].y-ph.path[i-1].y)*t;
        break;
      }
      sx=ph.path[i].x;sy=ph.path[i].y;
    }
    drawCube(ctx,sx-CELL/2,sy-CELL/2,ph.color,CELL,true,1);
  }

  // Launcher area (no separator — same background as grid)

  // Current cube in launcher
  var lcx=BW/2-CELL/2;
  var lcy=BH+(LAUNCHER_H-CELL)/2;
  drawCube(ctx,lcx,lcy,currentColor,CELL,false,1);

  // Swap animation flash
  var swapElapsed=performance.now()-swapAnim;
  if(swapAnim>0&&swapElapsed<250){
    var alp=0.6*(1-swapElapsed/250);
    var expand=swapElapsed/250*8;
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,'+alp+')';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(lcx+CELL/2,lcy+CELL/2,CELL/2+expand,0,Math.PI*2);
    ctx.stroke();ctx.restore();
  }

  // Aim arrow from launcher toward mouse
  if(mousePos&&active&&ph.type==='idle'&&mousePos.y<BH){
    var arrowLen=22;
    var lCenterX=BW/2,lCenterY=BH+LAUNCHER_H/2;
    var adx=mousePos.x-lCenterX,ady=mousePos.y-lCenterY;
    var alen=Math.sqrt(adx*adx+ady*ady);
    if(alen>0&&ady<0){
      adx/=alen;ady/=alen;
      var tipX=lCenterX+adx*arrowLen,tipY=lCenterY+ady*arrowLen;
      ctx.save();
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(lCenterX,lCenterY);ctx.lineTo(tipX,tipY);ctx.stroke();
      var headLen=6;var angle=Math.atan2(ady,adx);
      ctx.beginPath();
      ctx.moveTo(tipX,tipY);ctx.lineTo(tipX-headLen*Math.cos(angle-0.5),tipY-headLen*Math.sin(angle-0.5));
      ctx.moveTo(tipX,tipY);ctx.lineTo(tipX-headLen*Math.cos(angle+0.5),tipY-headLen*Math.sin(angle+0.5));
      ctx.stroke();ctx.restore();
    }
  }

  // Next cube indicator
  var nSize=CELL*0.55;
  var nx=lcx+CELL+12;
  var ny=BH+(LAUNCHER_H-nSize)/2;
  drawCube(ctx,nx,ny,nextColor,nSize,false,0.7);

  // Particles
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life)*0.8;
    ctx.fillStyle='rgb('+p.c[0]+','+p.c[1]+','+p.c[2]+')';
    ctx.beginPath();ctx.arc(p.x,p.y,p.s*Math.max(0,p.life),0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(render);
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
(function init(){
  cv=document.getElementById('cv');
  cv.width=CANVAS_W;cv.height=CANVAS_H;
  ctx=cv.getContext('2d');

  // Build atlas for optimized rendering
  buildAtlas();

  // Pointer Events — unified mouse + touch
  cv.addEventListener('pointerdown',handlePointerDown);
  cv.addEventListener('pointermove',handlePointerMove);
  cv.addEventListener('pointerup',handlePointerUp);
  cv.addEventListener('pointerleave',handlePointerLeave);
  cv.addEventListener('contextmenu',handleContextMenu);

  document.getElementById('play-btn').addEventListener('click',startGame);

  document.getElementById('restart-yes-btn').addEventListener('click',function(){
    if(restartConfirm){restartConfirm=false;document.getElementById('restart-overlay').style.display='none';paused=false;document.getElementById('pause-overlay').style.display='none';updatePauseBtn();startGame()}
  });

  document.getElementById('lang-btn').addEventListener('click',function(){
    state.lang=state.lang==='ru'?'en':'ru';
    try{localStorage.setItem(LANG_KEY,state.lang)}catch(e){}
    renderTitle();updateLangBtn();
    document.getElementById('score-label').textContent=l('score');
    document.getElementById('time-label').textContent=l('time');
    if(state.overlay==='start'){document.getElementById('play-btn').textContent=l('play');renderLB(state.uiLB,-1,'start-lb')}
    if(state.overlay==='gameover'){document.getElementById('go-title').textContent=l('gameOver');document.getElementById('play-btn').textContent=l('play');renderLB(state.uiLB,state.uiHi,'go-lb')}
    if(state.overlay==='victory'){document.getElementById('vic-title').textContent=l('victory');document.getElementById('play-btn').textContent=l('play');renderLB(state.uiLB,state.uiHi,'vic-lb')}
    if(gpConnected)document.getElementById('gpIndicator').textContent='🎮 '+l('gamepad');
    if(paused)document.getElementById('pause-title').textContent=l('pause');
    if(restartConfirm){document.getElementById('restart-title').textContent=l('restartQ');document.getElementById('restart-yes-btn').textContent=l('restartYes');document.getElementById('restart-hint').textContent=l('restartHint')}
  });

  document.getElementById('sound-btn').addEventListener('click',function(){
    state.soundOn=!state.soundOn;
    try{localStorage.setItem(SOUND_KEY,state.soundOn?'on':'off')}catch(e){}
    updateSoundBtn();
    if(state.soundOn)initAudio();
  });

  // Build UI
  renderTitle();
  updateLangBtn();
  updateSoundBtn();
  document.getElementById('score-label').textContent=l('score');
  document.getElementById('time-label').textContent=l('time');
  showOverlay('start');

  // Start render loop
  lastT=performance.now();
  requestAnimationFrame(render);
})();
</script>
